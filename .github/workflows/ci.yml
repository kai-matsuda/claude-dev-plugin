name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# push and pull_request both fire for a PR branch: a newer run supersedes the older one
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PLUGIN_SKILLS: ${{ github.workspace }}/.mattpocock-skills/skills
      # a PR into main diffs against its base; a push or another PR target falls back to the merge-base with origin's default branch
      VERSION_BUMP_BASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: mattpocock/skills
          ref: v1.3.1
          path: .mattpocock-skills
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @beads/bd@1.3.1
        # bd's postinstall skips the binary download when CI is set, leaving only the wrapper
        env:
          CI: ""
      - run: make check
